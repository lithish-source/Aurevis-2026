<?xml version="1.0" encoding="utf-8"?>
<!-- Chennai One · triangle route mark -->
<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chennai One logo">
  <defs>
    <linearGradient id="c1tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232E6B"/>
      <stop offset="0.55" stop-color="#1A56DB"/>
      <stop offset="1" stop-color="#1A6FE0"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="26" fill="url(#c1tile)"/>
  <!-- triangle route -->
  <path d="M48 26 L73.5 68.5 L22.5 68.5 Z" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- vertex station dots -->
  <circle cx="48" cy="26" r="7" fill="#FFFFFF"/>
  <circle cx="22.5" cy="68.5" r="7" fill="#FFFFFF"/>
  <circle cx="73.5" cy="68.5" r="7" fill="#FFFFFF"/>
  <!-- live "you are here" dot at the apex -->
  <circle cx="48" cy="26" r="3.2" fill="#1A56DB"/>
  <!-- road tick under the triangle -->
  <path d="M32 80 H64" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 8"/>
</svg>
